name: MusicGen CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # We halen IMAGE_NAME hier weg en zetten hem dynamisch in de steps

jobs:
  build-test-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Code ophalen
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. NAAM FIXEN (Hoofdletters naar kleine letters)
      - name: Lowercase Repo Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 3. Inloggen op GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Bouwen (Lokaal voor de test)
      - name: Build Docker image (Local)
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: test-image:local
          file: Dockerfile

      # 5. De Test Draaien (Sanity Check)
      - name: Run Sanity Check (Test)
        run: |
          docker run --rm -v ${{ github.workspace }}:/app test-image:local python test_ci.py

      # 6. Pushen naar GitHub (Nu met kleine letters!)
      - name: Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          file: Dockerfile

      # 7. Deploy naar Productie
      - name: Deploy to Production VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Inloggen
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Nieuwe versie ophalen
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Oude container stoppen
            docker stop musicgen_prod || true
            docker rm musicgen_prod || true
            
            # Nieuwe container starten
            docker run -d \
              --name musicgen_prod \
              --restart unless-stopped \
              --gpus all \
              -p 7860:7860 \
              -v /root/musicproject_prod/cache:/root/.cache \
              -v /root/musicproject_prod/generated:/app/generated \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Opruimen
            docker image prune -f

      # 8. Schoonmaak op Dev VM
      - name: Cleanup Dev VM
        if: always()
        run: docker image prune -f
