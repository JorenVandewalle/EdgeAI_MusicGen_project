name: Build and Push Docker image

# Trigger de workflow bij een push naar main OF test-features
on:
  push:
    branches: [ "main", "test-features" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Bouwen & Pushen (Draait voor alle branches in de lijst hierboven)
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Job 2: Deploy naar Productie (Draait ALLEEN als de branch 'main' is)
  deploy_prod:
    needs: build_and_push
    if: github.ref == 'refs/heads/main'  # Beveiliging: voorkomt deploy vanaf test-takken
    runs-on: [self-hosted, production]

    steps:
      - name: Pull Docker image
        run: |
          # Login bij GitHub Container Registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Zet image naam om naar kleine letters en pull de main tag
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker pull $IMAGE_ID:main

      - name: Stop and Remove old container
        run: |
          docker stop musicgen_prod || true
          docker rm musicgen_prod || true

      - name: Start new container
        run: |
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Start container met productie-volumes
          docker run -d \
            --name musicgen_prod \
            --restart unless-stopped \
            --gpus all \
            -p 7860:7860 \
            -v /root/musicproject_prod/generated:/app/generated \
            -v /root/musicproject_prod/cache:/root/.cache \
            $IMAGE_ID:main
