name: MusicGen Multi-Runner Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  # --- STAP 1: BOUWEN (Op de Dev VM) ---
  build_image:
    # We sturen dit naar de runner ZONDER 'production' label (dus je Dev VM)
    runs-on: [self-hosted, Linux, X64] 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set Lowercase Image Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          file: Dockerfile

  # --- STAP 2: DEPLOYEN (Op de Productie VM) ---
  deploy_prod:
    needs: build_image  # Wacht tot het bouwen klaar is
    # Hier sturen we het specifiek naar de runner met het label 'production'
    runs-on: [self-hosted, production]
    
    steps:
      - name: Set Lowercase Image Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull new image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Restart Container
        run: |
          # Oude container stoppen
          docker stop musicgen_prod || true
          docker rm musicgen_prod || true
          
          # Nieuwe container starten
          docker run -d \
            --name musicgen_prod \
            --restart unless-stopped \
            --gpus all \
            -p 7860:7860 \
            -v /root/musicproject_prod/cache:/root/.cache \
            -v /root/musicproject_prod/generated:/app/generated \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
      - name: Cleanup
        run: docker image prune -f
